services:
  ecommerce_app:
    container_name: ecommerce_app
    build:
      context: .
    ports:
      - 80:8000
    networks:
      - ecommerce_network
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - ecommerce_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


networks:
  ecommerce_network:
    name: ecommerce_network
    driver: bridge

volumes:
  postgres_data:
