services:
  db:
    image: postgres:16
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./ecommerce_db:/var/lib/postgresql/data

volumes:
  pgdata: